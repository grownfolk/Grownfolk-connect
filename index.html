<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connect to Grown Folk</title>
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script defer src="app.js"></script>
  <style>
    body {
      background: #f9f9f9;
      color: #00274D;
      font-family: 'Helvetica Neue', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 16px;
    }
    .logo {
      width: 100px;
      margin-bottom: 20px;
    }
    .button {
      display: block;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 24px;
      border-radius: 8px;
      margin-bottom: 14px;
      color: white;
    }
    .button.red {
      background: #C8102E;
    }
    .button.blue {
      background: #003366;
    }
    .link {
      color: #C8102E;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="grownfolk-icon192.png" alt="GrownFolk Logo" />
    <h2>Connect to Grown Folk</h2>
    <p>Link your wallet or create your profile to activate your place in the movement.<br><strong>Real people. Real power.</strong></p>
    <button class="button red" onclick="connectWallet()">Connect with Wallet</button>
    <a class="button blue" href="https://grownfolk.us/?xgi=E76K6P9MyZAL0k" target="_blank">Create Grown Folk Profile</a>
    <p style="margin-top:18px;color:#444;">Need help? Visit the <a class="link" href="https://grownfolk.us/app">Mobile Setup Page</a>.</p>
    <div id="wallet-address" style="margin-top: 20px; font-weight: bold;"></div>
  </div>
</body>
</html>
